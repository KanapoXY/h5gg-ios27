name: Build H5GG (iOS 27 adaptation)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          if [ ! -d "$HOME/theos/.git" ]; then
            git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          else
            echo "theos already present, reusing"
          fi
          # theos 仓库自带的 sdks 占位目录不含真实 SDK，强制替换为官方 SDK 仓库
          rm -rf $HOME/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Show available SDKs
        run: ls $HOME/theos/sdks

      - name: Build dylib
        run: |
          export THEOS=$HOME/theos
          SDKVER=$(ls $THEOS/sdks | grep -E '^iPhoneOS([0-9]+\.?)+\.sdk$' | sed 's/^iPhoneOS//; s/\.sdk$//' | sort -V | tail -1)
          echo "Using SDK: iPhoneOS$SDKVER.sdk"
          make TARGET="iphone:${SDKVER}:11.4" FINALPACKAGE=1

      - name: Build deb package
        run: |
          export THEOS=$HOME/theos
          SDKVER=$(ls $THEOS/sdks | grep -E '^iPhoneOS([0-9]+\.?)+\.sdk$' | sed 's/^iPhoneOS//; s/\.sdk$//' | sort -V | tail -1)
          make TARGET="iphone:${SDKVER}:11.4" package FINALPACKAGE=1 || true

      - name: Collect artifacts
        run: |
          mkdir -p out
          find theos -name "*.dylib" -not -path "*dSYM*" -exec cp {} out/ \;
          cp packages/*.deb out/ 2>/dev/null || true
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: H5GG-iOS27-adapted
          path: out/
